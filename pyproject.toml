[project]
name = "yu-agent"
version = "0.1.0"
description = "通用智能体框架（首期能力：分支代码审查）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-ai-slim>=2.0,<3.0",   # Agent 内核（锁定 2.x，升级前跑 e2e）
    "openai>=1.50",                 # OpenAI 兼容客户端（模型池）
    "httpx>=0.27",                  # GitLab REST / 钉钉 OpenAPI
    "pyyaml>=6.0",
    "sqlglot>=25.0",                # 慢查静态预扫
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "dingtalk-stream>=0.20",        # 钉钉 Stream 模式机器人
    "ruamel-yaml>=0.19.1",
    "fastmcp>=4.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
